[tool.poetry]
name = "casefile"
version = "0.1.0"
description = "AI-powered insurance claim adjudication system with multi-agent workflow orchestration"
authors = ["CASEFILE Team"]
readme = "README.md"
license = "Apache-2.0"
packages = [{include = "casefile", from = "src"}]

[tool.poetry.dependencies]
python = "^3.11"

# Core orchestration
langgraph = "^0.2.0"
langchain-core = "^0.3.0"

# LLM providers
langchain-openai = "^0.2.0"
langchain-anthropic = "^0.2.0"

# Data validation
pydantic = "^2.9"
pydantic-settings = "^2.5"

# Database
sqlalchemy = "^2.0"
alembic = "^1.13"

# Caching
redis = "^5.0"
hiredis = "^2.3"

# Observability
opentelemetry-api = "^1.27"
opentelemetry-sdk = "^1.27"
opentelemetry-instrumentation = "^0.48b0"
opentelemetry-exporter-otlp = "^1.27"
structlog = "^24.4"

# HTTP clients
httpx = "^0.27"
aiohttp = "^3.10"

# Web framework & API
fastapi = ">=0.115.0"
uvicorn = ">=0.30.0"

# Utilities
python-dotenv = "^1.0"
tenacity = "^9.0"
click = "^8.1"

[tool.poetry.group.dev.dependencies]
# Testing
pytest = "^8.3"
pytest-asyncio = "^0.24"
pytest-cov = "^5.0"
pytest-mock = "^3.14"
faker = "^30.0"

# Code quality
ruff = "^0.6"
black = "^24.8"
mypy = "^1.11"
pre-commit = "^3.8"

# Type stubs
types-redis = "^4.6"
types-pyyaml = "^6.0"

[tool.poetry.scripts]
casefile = "casefile.cli:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# Ruff configuration
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long (handled by black)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Allow unused imports in __init__.py

# Black configuration
[tool.black]
line-length = 100
target-version = ["py311"]

# Mypy configuration
[tool.mypy]
python_version = "3.11"
mypy_path = "src"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
follow_imports = "normal"

[[tool.mypy.overrides]]
module = [
    "langgraph.*",
    "langchain_core.*",
    "langchain_openai.*",
    "langchain_anthropic.*",
]
ignore_missing_imports = true

# Click decorators (@click.command, @click.option, etc.) do not have complete
# type stubs and trigger [misc] "Untyped decorator makes function untyped".
# The CLI module contains no domain logic; suppressing misc here is correct.
[[tool.mypy.overrides]]
module = ["casefile.cli"]
disallow_untyped_decorators = false

# pytest.mark.* decorators are dynamically generated and untyped.
# Domain logic in tests is still fully checked.
[[tool.mypy.overrides]]
module = [
    "tests.*",
    "tests.unit.*",
    "tests.integration.*",
]
disallow_untyped_decorators = false

# Pytest configuration
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=casefile",
    "--cov-report=term-missing",
    "--cov-report=html",
]
markers = [
    "unit: Unit tests (fast, isolated)",
    "integration: Integration tests (require external services)",
    "slow: Slow tests (>1 second)",
]

# Coverage configuration
[tool.coverage.run]
source = ["src/casefile"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/migrations/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

# CASEFILE Development Services
# Run: docker-compose up -d
# NOTE: Persistence is SQLite (local file, no server). Docker provides only
# Redis (ephemeral coordination/cache) and Jaeger (observability).

version: '3.8'

services:
  # Redis cache
  redis:
    image: redis:7-alpine
    container_name: casefile-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Jaeger for OpenTelemetry traces (development)
  jaeger:
    image: jaegertracing/all-in-one:1.51
    container_name: casefile-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"  # Jaeger UI
      - "14268:14268"  # HTTP collector
      - "4317:4317"    # OTLP gRPC
      - "4318:4318"    # OTLP HTTP
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:14269/"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  redis_data:
